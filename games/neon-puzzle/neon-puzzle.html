<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Neon Puzzle | Portafolio Gamer</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="neon-puzzle.css" />
</head>

<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <div id="app">
    <header class="top-bar">
      <h1 class="title">NEON PUZZLE</h1>
      <a href="../../index.html" class="back-link">← Portafolio</a>
    </header>

    <div class="toolbar">
      <label class="field">
        <span>Dificultad</span>
        <select id="difficulty" aria-label="Dificultad">
          <option value="3">3×3 Fácil</option>
          <option value="4" selected>4×4 Normal</option>
          <option value="5">5×5 Difícil</option>
        </select>
      </label>
      <button type="button" id="shuffle-btn" class="btn">MEZCLAR</button>
      <button type="button" id="pause-btn" class="btn btn-outline" title="P / Esc">PAUSA</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-label">Movimientos</span><strong id="moves">0</strong></div>
      <div class="stat"><span class="stat-label">Tiempo</span><strong id="timer">00:00</strong></div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Tablero del puzzle"></div>
    </div>

    <p class="hint">Toca una ficha junto al hueco · <kbd>P</kbd> / <kbd>ESC</kbd> pausa</p>
  </div>

  <!-- Pausa -->
  <div id="pause-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="modal-card">
      <div class="pause-icon" aria-hidden="true">⏸</div>
      <h2 id="pause-title">PAUSA</h2>
      <p class="modal-sub">El tablero está congelado</p>
      <button type="button" id="resume-btn" class="btn btn-block">CONTINUAR</button>
      <button type="button" id="pause-shuffle-btn" class="btn btn-outline btn-block">MEZCLAR</button>
      <p class="modal-hint"><kbd>P</kbd> o <kbd>ESC</kbd> para reanudar</p>
      <a href="../../index.html" class="back-link">← Volver al portafolio</a>
    </div>
  </div>

  <!-- Victoria -->
  <div id="win-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2>¡VICTORIA!</h2>
      <p>Movimientos: <span id="win-moves">0</span></p>
      <p>Tiempo: <span id="win-time">00:00</span></p>
      <p class="hi">Mejor: <span id="win-hi">—</span></p>
      <button type="button" id="play-again" class="btn btn-block">JUGAR DE NUEVO</button>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="neon-puzzle.js"></script>
  <script src="../../js/particles.js"></script>
</body>

</html>
