<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFD1">
        <animate attributeName="stop-color" values="#00FFD1;#00E6C0;#00FFD1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A;#FF4DA6;#FF007A" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Aura rosa pulsante -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FF007A" stroke-width="0.6" opacity="0.25" filter="url(#neonPink)">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="27;29;27" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Glow de la D -->
  <path d="M16 12 L34 12 Q46 12 46 24 L46 40 Q46 52 34 52 L16 52 L16 12 Z M24 20 L24 44 L32 44 Q38 44 38 38 L38 26 Q38 20 32 20 Z" fill="none" stroke="#00FFD1" stroke-width="2.2" stroke-linejoin="round" filter="url(#neonCyan)" opacity="0.9">
    <animate attributeName="stroke-width" values="2.0;2.6;2.0" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Relleno gradiente -->
  <path d="M16 12 L34 12 Q46 12 46 24 L46 40 Q46 52 34 52 L16 52 L16 12 Z M24 20 L24 44 L32 44 Q38 44 38 38 L38 26 Q38 20 32 20 Z" fill="url(#dGrad)" fill-rule="evenodd" opacity="0.92"/>
  <!-- Borde limpio -->
  <path d="M16 12 L34 12 Q46 12 46 24 L46 40 Q46 52 34 52 L16 52 L16 12 Z M24 20 L24 44 L32 44 Q38 44 38 38 L38 26 Q38 20 32 20 Z" fill="none" stroke="#00FFD1" stroke-width="1.4" stroke-linejoin="miter"/>
  <!-- Cortes angulares -->
  <line x1="16" y1="18" x2="22" y2="18" stroke="#0A0F1B" stroke-width="1.8"/>
  <line x1="16" y1="46" x2="22" y2="46" stroke="#0A0F1B" stroke-width="1.8"/>
  <!-- Circuito decorativo -->
  <g opacity="0.9">
    <rect x="40" y="22" width="3" height="3" fill="#00FFD1" rx="0.3">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M41.5 25 L41.5 30 L44 30" fill="none" stroke="#FF007A" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="44" cy="30" r="1.2" fill="#FF007A">
      <animate attributeName="r" values="1.0;1.5;1.0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.75">
    <rect x="20" y="48" width="2.5" height="2.5" fill="#00FFD1" rx="0.2"/>
    <path d="M21.25 48 L21.25 45.5 L24 45.5" fill="none" stroke="#00FFD1" stroke-width="0.8"/>
  </g>
</svg>
